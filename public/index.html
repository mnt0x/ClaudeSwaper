<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLMSwapper</title>
<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/style.css">
<!-- Tema antes de pintar: leerlo aqui, sincrono, evita el fogonazo oscuro de un cuadro entero
     cuando la preferencia guardada es clara. Es la unica razon por la que hay JS en el head. -->
<script>
  try {
    var t = localStorage.getItem('swapper.theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    var l = localStorage.getItem('swapper.lang');
    if (!l) l = (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
    document.documentElement.lang = l;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<!-- Favicon = el mismo logo de la web: las dobles flechas #i-swap, verde fosforo sobre
     el fondo del pin. Trazo algo mas grueso (1.8) para que se lea a 16px en la pestana. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'><rect width='18' height='18' rx='4' fill='%23040706'/><g fill='none' stroke='%2300ff9c' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M3.5 6.5h11m0 0-3-3m3 3-3 3'/><path d='M14.5 13.5h-11m0 0 3 3m-3-3 3-3'/></g></svg>">
</head>
<body>

<!-- Fondo firma: campo de brasas de fosforo a la deriva (flow-field). Lo pinta app.js en
     este canvas, a pantalla completa y DETRAS de todo (z-index:-1 en .field, CSS). Sin
     eventos (pointer-events:none via CSS). aria-hidden: es puramente ambiental.
     En tema claro se oculta por CSS: es aditivo y sobre blanco no suma nada. -->
<canvas class="field" id="field" aria-hidden="true"></canvas>

<!-- Icon set: one library, one stroke weight, referenced by <use>. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <g id="i-swap" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 6.5h11m0 0-3-3m3 3-3 3"/><path d="M14.5 13.5h-11m0 0 3 3m-3-3 3-3"/>
    </g>
    <g id="i-refresh" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 9a6 6 0 1 1-1.8-4.3"/><path d="M15.2 3v3.2H12"/>
    </g>
    <g id="i-import" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3v8m0 0 3-3m-3 3-3-3"/><path d="M3.5 12.5v1a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-1"/>
    </g>
    <g id="i-key" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5.8" cy="12.2" r="3"/><path d="M8 10 15 3"/><path d="M12.6 5.4l2 2"/><path d="M10.8 7.2l2 2"/>
    </g>
    <g id="i-edit" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.3 3.5a1.7 1.7 0 0 1 2.2 2.2L6.7 13.6l-3 .7.7-3 7.9-7.8Z"/>
    </g>
    <g id="i-close" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M5 5l8 8M13 5l-8 8"/>
    </g>
    <g id="i-alert" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 2.8 16.2 15H1.8L9 2.8Z"/><path d="M9 7v3.4"/><path d="M9 12.8h.01"/>
    </g>
    <g id="i-moon" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 11.2A6.5 6.5 0 0 1 6.8 3a6.5 6.5 0 1 0 8.2 8.2Z"/>
    </g>
    <g id="i-sun" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="3.4"/>
      <path d="M9 1.6v1.6M9 14.8v1.6M1.6 9h1.6M14.8 9h1.6M3.8 3.8l1.1 1.1M13.1 13.1l1.1 1.1M14.2 3.8l-1.1 1.1M4.9 13.1l-1.1 1.1"/>
    </g>
  </defs>
</svg>

<header class="masthead">
  <div class="identity">
    <!-- Logo de LLMSwapper: las dobles flechas #i-swap como traza viva de osciloscopio
         dentro de un pin con su mini-rejilla. Un punto de luz la recorre (app.js). -->
    <div class="scope-pin" aria-hidden="true">
      <svg class="scope-logo" viewBox="0 0 18 18" focusable="false"><use class="logo-base" href="#i-swap"/><use class="logo-trace" id="logo-swap" href="#i-swap"/></svg>
    </div>
    <h1>Swapper</h1>
  </div>

  <div class="toolbar">
    <span class="sync" id="sync" aria-live="polite"></span>
    <button class="btn btn-primary" id="btn-add-token" data-i18n-title="addToken.title">
      <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-key"/></svg>
      <span data-i18n="addToken">añadir token</span>
    </button>
    <button class="btn" id="btn-refresh" data-i18n-title="refresh.title">
      <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-refresh"/></svg>
      <span data-i18n="refresh">refresh</span>
    </button>

    <!-- Idioma y tema. Se tocan una vez y se olvidan, asi que van al extremo, despues de las
         acciones que si se repiten. aria-pressed marca cual esta activo, que es lo que un
         lector de pantalla necesita para un par de opciones excluyentes. -->
    <div class="switch" id="switch-lang" role="group" data-i18n-aria="lang.group">
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="switch" id="switch-theme" role="group" data-i18n-aria="theme.group">
      <button type="button" data-theme="dark" aria-pressed="false" data-i18n-aria="theme.dark">
        <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
      <button type="button" data-theme="light" aria-pressed="false" data-i18n-aria="theme.light">
        <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="notice notice-error" id="banner-offline" hidden>
  <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-alert"/></svg>
  <p data-i18n-html="banner.offline"></p>
</div>

<!-- Dos avisos que solo el servidor puede saber, y que en pantalla son indistinguibles de
     "todo va bien" si no se dicen: correr dentro de un contenedor (no ve los procesos del host
     ni sus distros WSL) y tener una variable de entorno que gana al fichero de credenciales,
     que convierte cada swap en un no-op silencioso. Se piden UNA vez, al arrancar. -->
<div class="notice notice-warn" id="banner-container" hidden>
  <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-alert"/></svg>
  <p data-i18n-html="banner.container"></p>
</div>

<div class="notice notice-error" id="banner-env" hidden>
  <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-alert"/></svg>
  <p><strong id="env-vars"></strong> <span data-i18n-html="banner.env"></span></p>
</div>

<!-- Isolated-login import. An inline field, not a prompt: it stays on the page, it can
     be styled, and Escape or cancel returns you exactly where you were. -->
<form class="field-row" id="dir-form" hidden>
  <label for="dir-input" data-i18n="dir.label">Importar desde otra carpeta de configuración</label>
  <div class="field-line">
    <span class="field-prefix" aria-hidden="true">CLAUDE_CONFIG_DIR</span>
    <input type="text" id="dir-input" name="dir" spellcheck="false" autocomplete="off"
           placeholder="/tmp/cuenta2" aria-describedby="dir-help">
    <button class="btn btn-primary" type="submit" data-i18n="dir.submit">importar</button>
    <button class="btn" type="button" id="dir-cancel" data-i18n="cancel">cancelar</button>
  </div>
  <p class="field-help" id="dir-help" data-i18n-html="dir.help"></p>
</form>

<!-- Alta por token de larga duracion (claude setup-token). Mismo patron inline que #dir-form:
     se queda en la pagina, se puede estilar, y Escape devuelve el foco donde estaba. El campo
     del token es type=password: no se teclea, se pega, y asi no queda a la vista de nadie que
     mire la pantalla ni lo guarda el autocompletado. -->
<form class="field-row" id="token-form" hidden>
  <label for="token-input" data-i18n="token.label">Añadir una cuenta con un token de larga duración</label>
  <div class="field-line">
    <span class="field-prefix" aria-hidden="true">token</span>
    <input type="password" id="token-input" name="token" spellcheck="false" autocomplete="off"
           data-i18n-ph="token.ph" aria-describedby="token-help">
    <input type="text" id="token-label" name="label" spellcheck="false" autocomplete="off"
           data-i18n-ph="token.namePh" data-i18n-aria="token.nameAria" maxlength="60">
    <button class="btn btn-primary" type="submit" data-i18n="token.submit">añadir</button>
    <button class="btn" type="button" id="token-cancel" data-i18n="cancel">cancelar</button>
  </div>
  <p class="field-help" id="token-help">
    <span data-i18n-html="token.help"></span>
    <!-- Vive en la ayuda y no en la fila de controles: es la respuesta a "no tengo ninguno",
         que es una pregunta previa a rellenar el campo, no un cuarto boton que compita con el. -->
    <button class="btn btn-inline" type="button" id="btn-get-token"
            data-i18n="token.get" data-i18n-title="token.getTitle">consíguelo</button>
  </p>
</form>

<main>
  <!-- Un entorno a la vez, elegido con pestañas: el host (Windows, macOS o Linux) y cada distro
       de WSL. Las cuentas son LAS MISMAS en todas; lo que cambia por entorno es cuál está activa
       y en qué ficheros escribe el swap. Antes se apilaban todas las secciones, que con tres
       entornos obligaba a bajar para ver la última. -->
  <div class="tabs" id="tabs" role="tablist" data-i18n-aria="tabs.group" hidden></div>
  <div id="envs" aria-busy="true"></div>

  <section class="empty" id="empty" hidden>
    <h2 data-i18n="empty.title">0 cuentas registradas</h2>
    <ol class="steps">
      <li><span data-i18n-html="empty.step1"></span></li>
      <li><span data-i18n="empty.step2">Apruébalo en el navegador y copia el token que imprime.</span></li>
      <li><span data-i18n-html="empty.step3"></span></li>
    </ol>
    <p class="footnote" data-i18n-html="empty.footnote"></p>
    <div class="empty-actions">
      <button class="btn btn-primary" id="btn-add-token-empty">
        <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-key"/></svg>
        <span data-i18n="addToken">añadir token</span>
      </button>
      <button class="btn" id="btn-import-empty">
        <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-import"/></svg>
        <span data-i18n="import.current">import cuenta actual</span>
      </button>
    </div>
  </section>
</main>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<template id="tpl-env">
  <section class="env">
    <div class="env-head">
      <button class="btn btn-import-env" type="button" data-i18n-title="import.title">
        <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-import"/></svg>
        <span data-i18n="import">import</span>
      </button>
    </div>
    <div class="panel">
      <div class="columns">
        <span data-i18n="col.account">account</span>
        <span data-i18n="col.session">session · 5h</span>
        <span data-i18n="col.week">week · 7d</span>
        <span class="sr-only" data-i18n="col.action">Acción</span>
      </div>
      <div class="rows"></div>
    </div>
  </section>
</template>

<template id="tpl-row">
  <article class="row">
    <div class="who">
      <span class="state-dot" aria-hidden="true"></span>
      <span class="name"></span>
      <!-- Ocupa la misma celda que .name y se intercambia con él, así renombrar ocurre donde el
           nombre ya está en vez de mover la fila. -->
      <input class="name-edit" type="text" maxlength="60" spellcheck="false" autocomplete="off" hidden>
    </div>

    <div class="meter" data-kind="session">
      <div class="meter-line">
        <span class="value"></span>
        <div class="track"><div class="fill"></div></div>
      </div>
      <span class="resets"></span>
    </div>

    <div class="meter" data-kind="weekly">
      <div class="meter-line">
        <span class="value"></span>
        <div class="track"><div class="fill"></div></div>
      </div>
      <span class="resets"></span>
    </div>

    <div class="actions">
      <button class="btn btn-swap">
        <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-swap"/></svg>
        <span data-i18n="swap">swap</span>
      </button>
      <span class="badge-active" data-i18n="inUse">in use</span>
      <button class="btn-icon btn-rename">
        <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-edit"/></svg>
      </button>
      <button class="btn-icon btn-remove">
        <svg class="ico" viewBox="0 0 18 18" aria-hidden="true"><use href="#i-close"/></svg>
      </button>

      <!-- Inline confirmation: a destructive step deserves a second beat, not a modal
           that steals focus from the whole page for one row. -->
      <div class="confirm" hidden>
        <span class="confirm-q" data-i18n="remove.q">¿quitar?</span>
        <button class="btn btn-danger btn-yes" data-i18n="yes">sí</button>
        <button class="btn btn-no" data-i18n="no">no</button>
      </div>
    </div>

    <p class="row-note" hidden></p>
  </article>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
